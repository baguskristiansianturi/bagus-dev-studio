<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lupa Kata Sandi | Bali Bagus Dev Studio</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: '#0B0F17',
                        card: '#131B2A',
                        border: '#1E293B',
                        accent: '#10B981',
                        accentHover: '#059669',
                        brandPurple: '#6366F1'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/custom.css">
</head>
<body class="bg-dark text-slate-100 font-sans antialiased min-h-screen flex flex-col justify-between">

    <!-- HEADER SIMPLES -->
    <header class="p-6 border-b border-border/50">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-accent to-brandPurple flex items-center justify-center font-extrabold text-dark text-xl">BB</div>
                <div>
                    <span class="text-lg font-bold block">BALI BAGUS</span>
                    <span class="text-xs text-emerald-400 font-medium tracking-widest block uppercase">DEV STUDIO</span>
                </div>
            </a>
            <a href="login.html" class="text-sm font-medium text-slate-400 hover:text-white transition-colors">
                <i class="fa-solid fa-arrow-left mr-1"></i> Kembali ke Login
            </a>
        </div>
    </header>

    <main class="flex-grow flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-md w-full bg-card p-8 rounded-2xl border border-border shadow-2xl">
            <div class="text-center mb-8">
                <div class="w-12 h-12 bg-accent/10 rounded-full flex items-center justify-center text-accent text-xl mx-auto mb-4 border border-accent/20">
                    <i class="fa-solid fa-key"></i>
                </div>
                <h1 class="text-2xl font-extrabold text-white">Lupa Kata Sandi?</h1>
                <p class="text-slate-400 text-sm mt-1">Masukkan alamat email terdaftar Anda. Kami akan mengirimkan tautan untuk mengatur ulang kata sandi.</p>
            </div>

            <form id="form-reset" onsubmit="handleReset(event)" class="space-y-5">
                <div>
                    <label for="reset-email" class="block text-xs font-semibold text-slate-300 mb-1.5">Alamat Email</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
                            <i class="fa-regular fa-envelope"></i>
                        </span>
                        <input type="email" id="reset-email" required placeholder="nama@email.com" class="w-full bg-dark border border-border rounded-xl pl-10 pr-4 py-2.5 text-sm text-white focus:outline-none focus:border-accent transition-colors">
                    </div>
                </div>

                <button type="submit" class="w-full py-3 bg-accent hover:bg-accentHover text-dark font-bold rounded-xl text-sm transition-all shadow-lg shadow-accent/20">
                    Kirim Instruksi Reset
                </button>
            </form>

            <div class="mt-6 pt-6 border-t border-border text-center text-xs text-slate-400">
                Ingat kata sandi Anda? <a href="login.html" class="text-accent font-semibold hover:underline">Masuk Kembali</a>
            </div>
        </div>
    </main>

    <footer class="p-6 text-center text-xs text-slate-500 border-t border-border/50">
        &copy; 2026 Bali Bagus Dev Studio. All rights reserved.
    </footer>

    <script src="assets/js/app.js"></script>
    <script>
        function handleReset(e) {
            e.preventDefault();
            const email = document.getElementById('reset-email').value;
            alert(`Instruksi reset kata sandi telah dikirimkan ke email: ${email}`);
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
