<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk Akun | Bali Bagus Dev Studio</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: '#0B0F17',
                        card: '#131B2A',
                        border: '#1E293B',
                        accent: '#10B981',
                        accentHover: '#059669',
                        brandPurple: '#6366F1'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/custom.css">
    <link rel="stylesheet" href="assets/css/global-ui.css">
</head>
<body class="bg-dark text-slate-100 font-sans antialiased min-h-screen flex flex-col justify-between">

    <!-- HEADER SIMPLES -->
    <header class="p-6 border-b border-border/50">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-accent to-brandPurple flex items-center justify-center font-extrabold text-dark text-xl">BB</div>
                <div>
                    <span class="text-lg font-bold block">BALI BAGUS</span>
                    <span class="text-xs text-emerald-400 font-medium tracking-widest block uppercase">DEV STUDIO</span>
                </div>
            </a>
            <a href="index.html" class="text-sm font-medium text-slate-400 hover:text-white transition-colors">
                <i class="fa-solid fa-arrow-left mr-1"></i> Kembali ke Beranda
            </a>
        </div>
    </header>

    <main class="flex-grow flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-md w-full bg-card p-8 rounded-2xl border border-border shadow-2xl">
            <div class="text-center mb-8">
                <h1 class="text-2xl font-extrabold text-white">Selamat Datang Kembali</h1>
                <p class="text-slate-400 text-sm mt-1">Masuk ke portal member untuk mengakses lisensi & unduhan Anda.</p>
            </div>

            <form id="form-login" onsubmit="handleLogin(event)" class="space-y-5">
                <div>
                    <label for="email" class="block text-xs font-semibold text-slate-300 mb-1.5">Alamat Email</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
                            <i class="fa-regular fa-envelope"></i>
                        </span>
                        <input type="email" id="email" required placeholder="nama@email.com" class="w-full bg-dark border border-border rounded-xl pl-10 pr-4 py-2.5 text-sm text-white focus:outline-none focus:border-accent transition-colors">
                    </div>
                </div>

                <div>
                    <div class="flex items-center justify-between mb-1.5">
                        <label for="password" class="block text-xs font-semibold text-slate-300">Kata Sandi</label>
                        <a href="forgot-password.html" class="text-xs text-accent hover:underline">Lupa sandi?</a>
                    </div>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
                            <i class="fa-solid fa-lock"></i>
                        </span>
                        <input type="password" id="password" required placeholder="••••••••" class="w-full bg-dark border border-border rounded-xl pl-10 pr-4 py-2.5 text-sm text-white focus:outline-none focus:border-accent transition-colors">
                    </div>
                </div>

                <div class="flex items-center">
                    <input type="checkbox" id="remember" class="w-4 h-4 rounded border-border bg-dark text-accent focus:ring-accent accent-accent">
                    <label for="remember" class="ml-2 text-xs text-slate-400">Ingat saya di perangkat ini</label>
                </div>

                <button type="submit" class="w-full py-3 bg-accent hover:bg-accentHover text-dark font-bold rounded-xl text-sm transition-all shadow-lg shadow-accent/20">
                    Masuk Sekarang
                </button>
            </form>

            <div class="mt-6 pt-6 border-t border-border text-center text-xs text-slate-400">
                Belum memiliki akun? <a href="register.html" class="text-accent font-semibold hover:underline">Daftar Akun Baru</a>
            </div>
        </div>
    </main>

    <footer class="p-6 text-center text-xs text-slate-500 border-t border-border/50">
        &copy; 2026 Bali Bagus Dev Studio. All rights reserved.
    </footer>

    <script src="assets/js/app.js"></script>
    <script>
        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            
            // Simulasi sesi login pengguna
            localStorage.setItem('bb_user_session', JSON.stringify({
                email: email,
                name: email.split('@')[0],
                loggedIn: true
            }));

            alert('Login berhasil! Mengalihkan ke Dashboard...');
            window.location.href = 'dashboard/my-downloads.html';
        }
    </script>
    <script src="assets/js/global-ui.js"></script>
</body>
</html>
