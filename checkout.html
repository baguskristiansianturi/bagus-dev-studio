<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout — Bali Bagus Dev Studio</title>
    
    <!-- TAILWIND CDN (Fallback agar styling tidak pecah saat preview di VS Code) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- CSS Dependencies Eksisting -->
    <link rel="stylesheet" href="assets/css/tailwind.css">
    <link rel="stylesheet" href="assets/css/custom.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js" defer></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased selection:bg-indigo-500 selection:text-white">

    <!-- NAVIGATION HEADER -->
    <header class="sticky top-0 z-50 bg-slate-900/90 backdrop-blur-md border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-20">
                <a href="index.html" class="flex items-center gap-3 group">
                    <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center font-bold text-xl text-white shadow-lg shadow-indigo-500/30 group-hover:scale-105 transition">
                        B
                    </div>
                    <div class="flex flex-col">
                        <span class="font-extrabold text-lg tracking-tight text-white group-hover:text-indigo-400 transition">BALI BAGUS</span>
                        <span class="text-xs text-slate-400 -mt-1 tracking-widest font-semibold uppercase">DEV STUDIO</span>
                    </div>
                </a>

                <div class="text-xs font-semibold text-slate-400 flex items-center gap-2">
                    <i class="fa-solid fa-lock text-indigo-400"></i> Secure Checkout
                </div>
            </div>
        </div>
    </header>

    <!-- MAIN CHECKOUT SECTION -->
    <section class="py-16 bg-slate-900">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="bg-slate-950 border border-slate-800 rounded-2xl p-8 shadow-xl">
                <h1 class="text-2xl font-bold text-white mb-2">Konfirmasi Pemesanan Layanan</h1>
                <p class="text-xs text-slate-400 mb-8">Lengkapi data Anda untuk memulai proses penyiapan *scope* dan alokasi tim proyek.</p>

                <form action="#" method="POST" class="space-y-6">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-xs font-medium text-slate-300 mb-2">Nama Lengkap</label>
                            <input type="text" required placeholder="Contoh: Budi Santoso" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-xs text-white focus:outline-none focus:border-indigo-500">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-300 mb-2">Nama Perusahaan / Bisnis</label>
                            <input type="text" placeholder="Contoh: PT Digital Indonesia" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-xs text-white focus:outline-none focus:border-indigo-500">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-xs font-medium text-slate-300 mb-2">Email</label>
                            <input type="email" required placeholder="budi@perusahaan.com" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-xs text-white focus:outline-none focus:border-indigo-500">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-300 mb-2">Nomor WhatsApp</label>
                            <input type="tel" required placeholder="081234567890" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-xs text-white focus:outline-none focus:border-indigo-500">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-2">Catatan Tambahan atau Link Referensi Proyek</label>
                        <textarea rows="4" placeholder="Jelaskan secara singkat mengenai bisnis Anda atau sertakan link contoh website yang disukai..." class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-xs text-white focus:outline-none focus:border-indigo-500"></textarea>
                    </div>

                    <div class="border-t border-slate-800 pt-6">
                        <button type="submit" class="w-full py-4 bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs rounded-xl text-center transition shadow-lg shadow-indigo-600/20">
                            Konfirmasi & Kirim Pesanan
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </section>

    <!-- FOOTER -->
    <footer class="bg-slate-950 border-t border-slate-800 text-slate-400 py-8 text-xs text-center">
        <p>&copy; 2026 Bali Bagus Dev Studio. All rights reserved.</p>
    </footer>

    <!-- SCRIPTS EKSISTING -->
    <script src="assets/js/app.js"></script>
    <script src="assets/js/cart-engine.js"></script>
</body>
</html>
