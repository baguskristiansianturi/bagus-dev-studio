<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout Pembayaran | Bali Bagus Dev Studio</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: '#0B0F17',
                        card: '#131B2A',
                        border: '#1E293B',
                        accent: '#10B981',
                        accentHover: '#059669',
                        brandPurple: '#6366F1'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/custom.css">
</head>
<body class="bg-dark text-slate-100 font-sans antialiased min-h-screen flex flex-col justify-between">

    <!-- HEADER -->
    <header class="border-b border-border/80 bg-dark/80 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-accent to-brandPurple flex items-center justify-center font-extrabold text-dark text-xl">BB</div>
                <span class="font-bold tracking-tight text-white">BALI BAGUS DEV STUDIO</span>
            </a>
            <span class="text-xs bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-3 py-1 rounded-full font-semibold">
                <i class="fa-solid fa-lock mr-1"></i> SSL Enkripsi Aman
            </span>
        </div>
    </header>

    <main class="flex-grow py-12">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="grid lg:grid-cols-3 gap-12">
                
                <!-- Left Column: Checkout Form & Payment Methods -->
                <div class="lg:col-span-2 space-y-8">
                    <!-- Customer Information -->
                    <div class="bg-card p-6 rounded-2xl border border-border">
                        <h3 class="text-lg font-bold mb-4 flex items-center gap-2">
                            <i class="fa-regular fa-user text-accent"></i> Informasi Pembeli & Akun
                        </h3>
                        <div class="grid md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-semibold text-slate-400 mb-1">Nama Lengkap *</label>
                                <input type="text" id="cust-name" required placeholder="Contoh: Budi Santoso" class="w-full bg-dark border border-border rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-accent">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-400 mb-1">Alamat Email *</label>
                                <input type="email" id="cust-email" required placeholder="budi@example.com" class="w-full bg-dark border border-border rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-accent">
                            </div>
                            <div class="md:col-span-2">
                                <label class="block text-xs font-semibold text-slate-400 mb-1">Nomor WhatsApp *</label>
                                <input type="tel" id="cust-phone" required placeholder="081234567890" class="w-full bg-dark border border-border rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-accent">
                                <p class="text-xs text-slate-500 mt-1">Akses file & link lisensi juga akan dikirimkan ke WhatsApp Anda.</p>
                            </div>
                        </div>
                    </div>

                    <!-- Payment Gateway Selection -->
                    <div class="bg-card p-6 rounded-2xl border border-border">
                        <h3 class="text-lg font-bold mb-4 flex items-center gap-2">
                            <i class="fa-regular fa-credit-card text-accent"></i> Metode Pembayaran
                        </h3>
                        
                        <div class="space-y-3">
                            <label class="flex items-center justify-between p-4 bg-dark rounded-xl border border-accent cursor-pointer">
                                <div class="flex items-center gap-3">
                                    <input type="radio" name="payment" value="qris" checked class="accent-accent">
                                    <div>
                                        <p class="font-bold text-sm">QRIS Instant (BCA, GoPay, OVO, Dana, ShopeePay)</p>
                                        <p class="text-xs text-slate-400">Verifikasi otomatis & akses langsung aktif</p>
                                    </div>
                                </div>
                                <span class="text-xs bg-accent/20 text-accent font-bold px-2.5 py-1 rounded">REKOMENDASI</span>
                            </label>

                            <label class="flex items-center justify-between p-4 bg-dark rounded-xl border border-border cursor-pointer hover:border-slate-600">
                                <div class="flex items-center gap-3">
                                    <input type="radio" name="payment" value="va" class="accent-accent">
                                    <div>
                                        <p class="font-bold text-sm">Virtual Account Bank (BCA, Mandiri, BRI, BNI)</p>
                                        <p class="text-xs text-slate-400">Transfer via ATM atau Mobile Banking</p>
                                    </div>
                                </div>
                            </label>
                        </div>
                    </div>
                </div>

                <!-- Right Column: Order Summary & Pay Action -->
                <div>
                    <div class="bg-card p-6 rounded-2xl border border-border sticky top-28">
                        <h3 class="text-lg font-bold mb-4 border-b border-border pb-3">Ringkasan Tagihan</h3>
                        
                        <div id="checkout-summary-list" class="space-y-3 mb-6 text-sm text-slate-300">
                            <!-- Populated dynamically -->
                        </div>

                        <div class="border-t border-border pt-4 mb-6 flex justify-between items-center">
                            <span class="font-bold text-base">Total Bayar</span>
                            <span id="checkout-total-price" class="font-extrabold text-2xl text-accent">Rp 0</span>
                        </div>

                        <button onclick="processOrder()" class="w-full py-4 bg-accent hover:bg-accentHover text-dark font-bold rounded-xl transition-all shadow-lg shadow-accent/20 flex items-center justify-center gap-2">
                            <i class="fa-solid fa-shield-halved"></i> Bayar Sekarang
                        </button>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <script src="assets/js/app.js"></script>
    <script src="assets/js/cart-engine.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const cart = CartEngine.getCart();
            const container = document.getElementById('checkout-summary-list');
            
            if (cart.length === 0) {
                window.location.href = 'products.html';
                return;
            }

            container.innerHTML = cart.map(item => `
                <div class="flex justify-between">
                    <span class="text-slate-300">${item.name}</span>
                    <span class="font-semibold text-white">Rp ${item.price.toLocaleString('id-ID')}</span>
                </div>
            `).join('');

            const total = CartEngine.getTotal();
            document.getElementById('checkout-total-price').innerText = `Rp ${total.toLocaleString('id-ID')}`;
        });

        function processOrder() {
            const name = document.getElementById('cust-name').value;
            const email = document.getElementById('cust-email').value;
            
            if (!name || !email) {
                alert('Silakan lengkapi Nama dan Email Anda terlebih dahulu.');
                return;
            }

            // Save order session simulation
            const orderData = {
                orderId: 'BB-' + Math.floor(100000 + Math.random() * 900000),
                customer: { name, email },
                items: CartEngine.getCart(),
                total: CartEngine.getTotal(),
                date: new Date().toLocaleDateString('id-ID')
            };
            
            localStorage.setItem('bb_last_order', JSON.stringify(orderData));
            CartEngine.clearCart();
            
            window.location.href = 'order-success.html';
        }
    </script>
</body>
</html>
